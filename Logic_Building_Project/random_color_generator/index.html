<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Random color</title>
</head>
<body>
    <style>

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        .myh3{
            color: cyan;
            padding: 10px 30px;
            border-radius: 10px;
            border: 2px solid #fff;
            background: #000;
            font-weight: bold;
            font-family: "Montserrat", sans-serif;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #special-btn {
            padding: 10px 15px;
            border: 2px solid white;
            color: cyan;
            background: #000;
            border-radius: 1rem;
            cursor: pointer;
        }

        .dark-body{
            background-color: black;
            color: white;
        }

        .btnYellow{
            background-color: yellow;
            color: #2a62fb;
            font-weight: bold;
            border: 2px solid cyan;
        }    
    </style>

    <h3 class="myh3"><span>rgb: (0, 0, 0)</span></h3>
    <div class="special-btns">
        <button class="btn" id="special-btn">Click me</button>
    </div>

</body>
</html>
